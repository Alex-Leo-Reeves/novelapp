<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060B">
    <title>Sign in to your TV - NovaRead</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #05060B;
            color: #F7F5F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        /* ambient orbs */
        
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        
        body::before {
            width: 380px;
            height: 380px;
            left: -120px;
            top: -120px;
            background: radial-gradient(circle, rgba(232, 77, 138, .20), transparent 68%);
            animation: drift1 18s ease-in-out infinite alternate;
        }
        
        body::after {
            width: 420px;
            height: 420px;
            right: -160px;
            bottom: -160px;
            background: radial-gradient(circle, rgba(34, 211, 238, .14), transparent 68%);
            animation: drift2 22s ease-in-out infinite alternate;
        }
        
        @keyframes drift1 {
            from {
                transform: translate(0, 0)
            }
            to {
                transform: translate(60px, 50px)
            }
        }
        
        @keyframes drift2 {
            from {
                transform: translate(0, 0)
            }
            to {
                transform: translate(-50px, -40px)
            }
        }
        
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(12, 14, 22, .92);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 22px;
            padding: 34px 26px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            justify-content: center;
            font-weight: 900;
            font-size: 23px;
            margin-bottom: 6px;
            letter-spacing: -.01em;
        }
        
        .logo svg {
            width: 30px;
            height: 30px
        }
        
        .logo .dot {
            color: #E84D8A
        }
        
        .subtitle {
            text-align: center;
            color: #9AA4B6;
            font-size: 14px;
            margin-bottom: 22px;
        }
        
        .code-box {
            background: #141824;
            border: 1px dashed rgba(34, 211, 238, .45);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .code-box::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22D3EE, transparent);
            animation: sheen 2.6s linear infinite;
        }
        
        @keyframes sheen {
            0% {
                transform: translateX(-100%)
            }
            100% {
                transform: translateX(100%)
            }
        }
        
        .code-box .label {
            font-size: 13px;
            color: #9AA4B6;
            margin-bottom: 9px;
            font-weight: 600
        }
        
        .code {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 13px;
            color: #22D3EE;
            font-variant-numeric: tabular-nums;
            padding-left: 13px;
            text-shadow: 0 0 24px rgba(34, 211, 238, .45);
        }
        
        .btn-app {
            width: 100%;
            background: #141824;
            border: 1px solid rgba(232, 77, 138, .5);
            border-radius: 13px;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            color: #FF9BC3;
            cursor: pointer;
            transition: transform .18s ease, border-color .25s ease, background .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }
        
        .btn-app:hover {
            transform: translateY(-2px);
            border-color: rgba(232, 77, 138, .9);
            background: #1a1220
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: center;
            color: #5A6478;
            font-size: 12px;
            margin: 20px 0 12px;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, .09);
        }
        
        input {
            width: 100%;
            background: #141824;
            border: 1px solid rgba(255, 255, 255, .13);
            border-radius: 11px;
            padding: 15px 16px;
            color: #F7F5F0;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        
        input::placeholder {
            color: #6B748A
        }
        
        input:focus {
            border-color: #22D3EE;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, .14)
        }
        
        button[type=submit] {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(92deg, #E84D8A, #FF784F);
            color: #fff;
            border: none;
            border-radius: 13px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .25s ease;
            box-shadow: 0 12px 30px rgba(232, 77, 138, .3);
        }
        
        button[type=submit]:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 38px rgba(232, 77, 138, .45)
        }
        
        button[type=submit]:disabled {
            opacity: .55;
            cursor: default;
            transform: none
        }
        
        .status {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            min-height: 22px;
            font-weight: 600
        }
        
        .status.ok {
            color: #06D6A0
        }
        
        .status.err {
            color: #F87171
        }
        
        .status.info {
            color: #60A5FA
        }
        
        .hidden {
            display: none!important
        }
        
        .dev {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            text-align: center;
            color: #F5C05D;
            font-size: 13px;
            font-weight: 800;
        }
        
        .dev .mail {
            display: block;
            color: #6B748A;
            font-weight: 600;
            font-size: 12px;
            margin-top: 3px
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg> NovaRead
            <span class="dot">.</span>TV
        </div>
        <div class="subtitle">Sign in to your TV</div>

        <div class="code-box">
            <div class="label">Enter this code on your TV if prompted</div>
            <div class="code" id="codeDisplay">----</div>
        </div>

        <button class="btn-app" id="openAppBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF9BC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
    </svg>
    Open NovelApp if installed
  </button>

        <div class="divider">OR SIGN IN WITH EMAIL</div>

        <form id="pairForm">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="submitBtn">Sign in and approve TV</button>
        </form>

        <div class="status" id="statusBox"></div>

        <div class="dev">
            Developed by Mike
            <span class="mail">masteralexleoreevesd1@gmail.com</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";
            var api = "https://novelapp1.onrender.com/api";
            var pair = new URLSearchParams(window.location.search).get("pair") || "";
            var code = new URLSearchParams(window.location.search).get("code") || "";

            (function showCode() {
                var el = document.getElementById("codeDisplay");
                if (code) {
                    el.textContent = code.split("").join(" ");
                }
            })();

            function setStatus(msg, type) {
                var el = document.getElementById("statusBox");
                el.textContent = msg || "";
                el.className = "status" + (type ? " " + type : "");
            }

            document.getElementById("openAppBtn").addEventListener("click", function() {
                if (!pair || !code) {
                    setStatus("Open this page from the QR code on your TV.", "err");
                    return;
                }
                setStatus("Opening NovelApp...", "info");
                window.location.href = "novelapp://pair?pair=" + encodeURIComponent(pair) + "&code=" + encodeURIComponent(code);
            });

            document.getElementById("pairForm").addEventListener("submit", function(e) {
                e.preventDefault();
                if (!pair || !code) {
                    setStatus("This link is missing pairing info. Scan the QR on your TV again.", "err");
                    return;
                }
                var email = document.getElementById("email").value.trim();
                var password = document.getElementById("password").value;
                if (!email || !password) {
                    setStatus("Enter your email and password.", "err");
                    return;
                }

                var btn = document.getElementById("submitBtn");
                btn.disabled = true;
                btn.textContent = "Signing in...";
                setStatus("Approving your TV...", "info");

                fetch(api + "/tv-pair/approve", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pair: pair,
                        code: code,
                        email: email,
                        password: password
                    })
                }).then(function(r) {
                    return r.json().then(function(d) {
                        return {
                            ok: r.ok,
                            d: d
                        };
                    });
                }).then(function(res) {
                    if (res.ok) {
                        setStatus("TV approved! It will refresh in a few seconds.", "ok");
                        document.getElementById("pairForm").classList.add("hidden");
                    } else {
                        setStatus(res.d.error || "Could not approve this TV.", "err");
                    }
                }).catch(function() {
                    setStatus("Network error. Try again.", "err");
                }).then(function() {
                    btn.disabled = false;
                    btn.textContent = "Sign in and approve TV";
                });
            });
        })();
    </script>
</body>

</html>
