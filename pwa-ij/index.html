<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="A gift for IJ ❤️" />
  <meta name="theme-color" content="#ff3385" />
  <meta name="description" content="A gift for IJ ❤️ — a bright, romantic pink iPhone-optimized PWA for novels, anime, and movies." />
  <meta name="referrer" content="origin-when-cross-origin" />
  
  <!-- Global AdShield: Stops popup windows and ad traps when tapping on mobile -->
  <script>
    (function() {
      try {
        var originalOpen = window.open;
        window.open = function(url, target, features) {
          // Block ad popups
          console.warn('[AdShield] Blocked popup window.open:', url);
          return null;
        };
        window.addEventListener('click', function(e) {
          var t = e.target;
          if (t && t.tagName === 'A' && (t.target === '_blank' || t.getAttribute('target') === '_blank')) {
            if (!t.closest('#root')) {
              e.preventDefault();
              e.stopPropagation();
              console.warn('[AdShield] Blocked external ad tab');
            }
          }
        }, true);
      } catch (_) {}
    })();
  </script>
  
  <link rel="icon" type="image/svg+xml" href="/ij/favicon.svg" />
  <link rel="apple-touch-icon" href="/ij/icon.svg" />
  <link rel="manifest" href="/ij/manifest.json" />
  
  <!-- Premium Fonts: Playfair Display for romance, Outfit for headings, Plus Jakarta Sans for reading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <title>A gift for IJ ❤️</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
