  <meta name="referrer" content="origin-when-cross-origin" />
  
  <!-- Global AdShield: Stops popup windows, ad traps, and background redirect traps -->
  <script>
    (function() {
      try {
        var originalOpen = window.open;
        window.open = function(url, target, features) {
          console.warn('[AdShield] Blocked popup window.open:', url);
          return null;
        };
        try {
          Object.defineProperty(window, 'open', {
            configurable: false,
            writable: false,
            value: function(url) {
              console.warn('[AdShield] Immutable blocked window.open:', url);
              return null;
            }
          });
        } catch (_) {}

        // Prevent background ad popunders by immediately restoring focus to PWA
        window.addEventListener('blur', function() {
          setTimeout(function() {
            try { window.focus(); } catch (_) {}
          }, 50);
        });

        // Intercept any unwanted external target=_blank anchor clicks
        window.addEventListener('click', function(e) {
          var t = e.target;
          while (t && t !== document.body) {
            if (t.tagName === 'A') {
              var target = t.getAttribute('target');
              var href = t.getAttribute('href') || '';
              if (target === '_blank' || (href.startsWith('http') && !href.includes(window.location.hostname))) {
                e.preventDefault();
                e.stopPropagation();
                console.warn('[AdShield] Blocked cross-origin ad link:', href);
                return;
              }
            }
            t = t.parentElement;
          }
        }, true);
      } catch (_) {}
    })();
  </script>
