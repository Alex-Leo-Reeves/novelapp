name: NovaRead
options:
  bundleIdPrefix: com.alexleoreeves
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    CURRENT_PROJECT_VERSION: 42
    MARKETING_VERSION: "1.42"
    SWIFT_VERSION: "5.0"
targets:
  NovaRead:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: Info.plist
    preBuildScripts:
      - name: Build ComposeApp shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alexleoreeves.novelapp.ios
        PRODUCT_NAME: NovaRead
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
    dependencies:
      - framework: "../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/ComposeApp.framework"
        embed: true
schemes:
  NovaRead:
    build:
      targets:
        NovaRead: all
    run:
      config: Debug
    archive:
      config: Release
