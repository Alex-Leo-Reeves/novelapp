name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ipa-build.yml"
      - "build.gradle.kts"
      - "composeApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "iosApp/**"
      - "local.defaults.properties"
      - "settings.gradle.kts"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build NovaRead IPA (shared Compose app)
    runs-on: macos-15
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      RAPID_API_HOST: ${{ secrets.RAPID_API_HOST }}
      MANGADEX_CLIENT_ID: ${{ secrets.MANGADEX_CLIENT_ID }}
      MANGADEX_CLIENT_SECRET: ${{ secrets.MANGADEX_CLIENT_SECRET }}
      MANGADEX_USERNAME: ${{ secrets.MANGADEX_USERNAME }}
      MANGADEX_PASSWORD: ${{ secrets.MANGADEX_PASSWORD }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_CLOUD_API_KEY: ${{ secrets.GROQ_CLOUD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        id: signing
        run: |
          missing=0
          for name in \
            IOS_BUNDLE_ID \
            IOS_CERTIFICATE_P12_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_PROVISIONING_PROFILE_NAME \
            IOS_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is required for a signed installable iPhone IPA."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$IOS_EXPORT_METHOD" ]; then
            echo "IOS_EXPORT_METHOD=ad-hoc" >> "$GITHUB_ENV"
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> "$GITHUB_ENV"
          fi

      - name: Normalize optional build secrets
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ] && [ -n "${GROQ_CLOUD_API_KEY:-}" ]; then
            echo "GROQ_API_KEY=$GROQ_CLOUD_API_KEY" >> "$GITHUB_ENV"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up JDK for Kotlin/Native
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write API key xcconfig
        run: |
          set -euo pipefail
          printf 'RAPID_API_KEY = %s\nRAPID_API_HOST = %s\nMANGADEX_CLIENT_ID = %s\nMANGADEX_CLIENT_SECRET = %s\nMANGADEX_USERNAME = %s\nMANGADEX_PASSWORD = %s\nTMDB_API_KEY = %s\nTMDB_READ_ACCESS_TOKEN = %s\nGROQ_API_KEY = %s\nGROQ_CLOUD_API_KEY = %s\n' \
            "${RAPID_API_KEY:-mock_rapid_api_key}" \
            "${RAPID_API_HOST:-webnovel.p.rapidapi.com}" \
            "${MANGADEX_CLIENT_ID:-mock_client_id}" \
            "${MANGADEX_CLIENT_SECRET:-mock_client_secret}" \
            "${MANGADEX_USERNAME:-mock_user}" \
            "${MANGADEX_PASSWORD:-mock_pass}" \
            "${TMDB_API_KEY:-mock_tmdb_api_key}" \
            "${TMDB_READ_ACCESS_TOKEN:-mock_tmdb_read_access_token}" \
            "${GROQ_API_KEY:-mock_groq_api_key}" \
            "${GROQ_CLOUD_API_KEY:-mock_groq_api_key}" \
            > iosApp/Config.xcconfig

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate --spec project.yml

      - name: Install Apple signing assets
        if: steps.signing.outputs.can_sign == 'true'
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/NovaRead.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null \
            || echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" 2>/dev/null \
            || echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/NovaRead.mobileprovision"

      - name: Build unsigned iPhone app for compile check
        if: steps.signing.outputs.can_sign != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ios

          xcodebuild \
            -project iosApp/NovaRead.xcodeproj \
            -scheme NovaRead \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean build

      - name: Package unsigned IPA artifact
        if: steps.signing.outputs.can_sign != 'true'
        run: |
          set -euo pipefail

          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/NovaRead.app"
          IPA_PATH="build/ios/novelapp-ios-unsigned.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Unsigned app bundle was not found at $APP_PATH"
            find build/ios/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print || true
            exit 1
          fi

          rm -rf build/ios/unsigned-payload
          mkdir -p build/ios/unsigned-payload/Payload
          cp -R "$APP_PATH" build/ios/unsigned-payload/Payload/NovaRead.app
          (cd build/ios/unsigned-payload && zip -qry "../novelapp-ios-unsigned.ipa" Payload)

          echo "Unsigned IPA created at $IPA_PATH"
          IPA_SIZE_MB=$(du -m "$IPA_PATH" | cut -f1)
          echo "Unsigned IPA size: ${IPA_SIZE_MB} MB"
          if [ "$IPA_SIZE_MB" -lt 40 ]; then
            echo "::error::Unsigned IPA is only ${IPA_SIZE_MB} MB - a full Compose Multiplatform app is expected to be larger. Refusing to publish a broken build."
            exit 1
          fi
          echo "::notice::Unsigned IPA artifact created. It is useful for inspection/testing, but an iPhone still needs a signed IPA to install normally."

      - name: Upload unsigned IPA artifact
        if: steps.signing.outputs.can_sign != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: novelapp-ios-unsigned-ipa
          path: build/ios/novelapp-ios-unsigned.ipa


      - name: Archive iPhone app
        if: steps.signing.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ios

          xcodebuild \
            -project iosApp/NovaRead.xcodeproj \
            -scheme NovaRead \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/NovaRead.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean archive

      - name: Export signed IPA
        if: steps.signing.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ios
          IOS_EXPORT_METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          python3 -c "import plistlib,os; p={'method':os.environ['IOS_EXPORT_METHOD'],'signingStyle':'manual','teamID':os.environ['IOS_TEAM_ID'],'provisioningProfiles':{os.environ['IOS_BUNDLE_ID']:os.environ['IOS_PROVISIONING_PROFILE_NAME']},'stripSwiftSymbols':True}; plistlib.dump(p, open('build/ios/ExportOptions.plist','wb'))"

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/NovaRead.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist build/ios/ExportOptions.plist

          mkdir -p site/downloads
          cp build/ios/export/*.ipa site/downloads/novelapp-ios.ipa

          SIGNED_IPA_PATH=$(ls build/ios/export/*.ipa 2>/dev/null | head -1)
          if [ -n "$SIGNED_IPA_PATH" ]; then
            SIGNED_SIZE_MB=$(du -m "$SIGNED_IPA_PATH" | cut -f1)
            echo "Signed IPA size: ${SIGNED_SIZE_MB} MB"
            if [ "$SIGNED_SIZE_MB" -lt 40 ]; then
              echo "::error::Signed IPA is only ${SIGNED_SIZE_MB} MB - a full Compose Multiplatform app is expected to be larger. Refusing to publish a broken build."
              exit 1
            fi
          fi

      - name: Upload IPA artifact
        if: steps.signing.outputs.can_sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: novelapp-ios-ipa
          path: build/ios/export/*.ipa

