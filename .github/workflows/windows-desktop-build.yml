name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-desktop-build.yml"
      - "build.gradle.kts"
      - "composeApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "local.defaults.properties"
      - "settings.gradle.kts"

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows EXE (portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release EXE
        shell: pwsh
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_HOST: ${{ secrets.RAPID_API_HOST }}
          MANGADEX_CLIENT_ID: ${{ secrets.MANGADEX_CLIENT_ID }}
          MANGADEX_CLIENT_SECRET: ${{ secrets.MANGADEX_CLIENT_SECRET }}
          MANGADEX_USERNAME: ${{ secrets.MANGADEX_USERNAME }}
          MANGADEX_PASSWORD: ${{ secrets.MANGADEX_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_CLOUD_API_KEY: ${{ secrets.GROQ_CLOUD_API_KEY }}
        run: .\gradlew.bat --no-daemon :composeApp:packageReleaseExe --stacktrace

      - name: Copy EXE to website downloads
        id: copy-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "composeApp/build" -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -notmatch "\\app\\" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "Windows EXE was not produced."
          }

          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "EXE produced: $($exe.FullName) ($sizeMB MB)"

          New-Item -ItemType Directory -Force -Path "site/downloads" | Out-Null
          Copy-Item $exe.FullName "site/downloads/novelapp-windows.exe" -Force
          "exe_path=site/downloads/novelapp-windows.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelapp-windows-exe
          path: ${{ steps.copy-exe.outputs.exe_path }}
          if-no-files-found: error

      - name: Publish EXE to downloads
        if: github.ref_name == 'main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads/novelapp-windows.exe
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No Windows EXE changes to publish."
          } else {
            git commit -m "Publish Windows EXE release [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          }

  release:
    name: Create v1.41 Release
    runs-on: ubuntu-latest
    needs: windows-exe
    if: github.ref_name == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: novelapp-windows-exe
          path: release-asset

      - name: Rename binary to novelapp-android.exe
        shell: bash
        run: mv release-asset/novelapp-windows.exe release-asset/novelapp-android.exe

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update tag v1.41
        run: |
          git tag -f v1.41
          git push origin v1.41 --force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.41
          name: NovelApp v1.41
          body: |
            NovelApp Windows desktop release v1.41
          files: release-asset/novelapp-android.exe
          fail_on_unmatched_files: true
